<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#2D2D2D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle texture lines -->
  <line x1="0" y1="180" x2="1200" y2="180" stroke="#8C3B2E" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#8C3B2E" stroke-width="1" opacity="0.1"/>

  <!-- Brand name -->
  <text x="600" y="290" font-family="Georgia, 'Times New Roman', serif"
        font-size="58" font-weight="300" letter-spacing="14" fill="#F7F3ED"
        text-anchor="middle">CHENGDU JOURNEYS</text>

  <!-- Horizontal rule -->
  <line x1="400" y1="320" x2="800" y2="320" stroke="#8C3B2E" stroke-width="1" opacity="0.6"/>

  <!-- Tagline -->
  <text x="600" y="370" font-family="Georgia, 'Times New Roman', serif"
        font-size="22" font-weight="300" letter-spacing="6" fill="#B85C4E"
        text-anchor="middle">Start in Chengdu. Go beyond.</text>

  <!-- Small mountain silhouette hint at bottom -->
  <polygon points="100,630 220,400 300,450 400,360 480,420 560,370 640,430 720,380 800,440 880,390 960,450 1100,630"
           fill="#3A3A3A" opacity="0.3"/>
</svg>
