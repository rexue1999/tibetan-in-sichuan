<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#3A3A3A"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8C3B2E"/>
      <stop offset="100%" stop-color="#B85C4E"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E1D9"/>
      <stop offset="100%" stop-color="#F2EFEA"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- Mountain silhouette — layered peaks inspired by western Sichuan -->
  <!-- Back peak (left) -->
  <polygon points="180,200 260,110 320,160 380,95 440,200" fill="#D0C8BD" opacity="0.5"/>
  <!-- Back peak (right) -->
  <polygon points="400,200 470,120 510,150 570,100 620,200" fill="#D0C8BD" opacity="0.4"/>

  <!-- Main foreground mountain range -->
  <polygon points="100,280 200,155 260,190 330,130 400,180 440,140 520,200 580,160 660,210 720,185 780,280" fill="url(#mountainGrad)"/>

  <!-- Journey path — a winding line suggesting movement through the landscape -->
  <path d="M 120,255 Q 200,240 260,200 Q 310,168 340,172 Q 380,178 420,195 Q 470,215 530,195 Q 580,178 620,200 Q 660,218 720,208"
        fill="none" stroke="url(#pathGrad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Small accent dot at path origin -->
  <circle cx="120" cy="255" r="2.8" fill="#8C3B2E"/>

  <!-- Small accent line at path end (horizon / continuation) -->
  <line x1="720" y1="208" x2="740" y2="205" stroke="#8C3B2E" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Brand name -->
  <text x="400" y="330" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="36" font-weight="300" letter-spacing="10" fill="#1F1F1F"
        text-anchor="middle">CHENGDU JOURNEYS</text>

  <!-- Tagline / descriptor -->
  <text x="400" y="358" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="10" font-weight="400" letter-spacing="5" fill="#8C3B2E"
        text-anchor="middle">WESTERN SICHUAN · BESPOKE TRAVEL</text>

  <!-- Subtle horizontal rule -->
  <line x1="330" y1="310" x2="470" y2="310" stroke="#1F1F1F" stroke-width="0.5" opacity="0.3"/>
</svg>
