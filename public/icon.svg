<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#3A3A3A"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8C3B2E"/>
      <stop offset="100%" stop-color="#B85C4E"/>
    </linearGradient>
  </defs>

  <!-- Back peaks (distant, lighter) -->
  <polygon points="35,100 55,55 70,80 85,48 100,100" fill="#D0C8BD" opacity="0.5"/>
  <polygon points="90,100 108,60 118,75 133,50 145,100" fill="#D0C8BD" opacity="0.4"/>

  <!-- Main foreground mountain range -->
  <polygon points="15,140 40,78 55,95 73,65 90,90 100,70 120,100 135,80 155,105 170,93 185,140" fill="url(#mountainGrad)"/>

  <!-- Journey path -->
  <path d="M 20,128 Q 40,120 55,100 Q 68,84 75,86 Q 85,89 95,98 Q 108,108 123,98 Q 135,89 145,100 Q 155,109 170,104"
        fill="none" stroke="url(#pathGrad)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Path origin dot -->
  <circle cx="20" cy="128" r="1.5" fill="#8C3B2E"/>

  <!-- Path continuation line -->
  <line x1="170" y1="104" x2="175" y2="103" stroke="#8C3B2E" stroke-width="0.8" stroke-linecap="round"/>
</svg>
